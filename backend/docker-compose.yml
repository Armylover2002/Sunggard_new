version: '3.8'

services:
  # Redis - Required for distributed operations
  redis:
    image: redis:7-alpine
    container_name: quickcommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - quickcommerce-network

  # API Service - HTTP/WebSocket server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickcommerce-api
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      PROCESS_ROLE: api
      NODE_ENV: production
      PORT: 7000
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - quickcommerce-network

  # Worker Service - Background job processor
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickcommerce-worker
    env_file:
      - .env
    environment:
      PROCESS_ROLE: worker
      NODE_ENV: production
      HEALTH_CHECK_PORT: 9090
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - quickcommerce-network

  # Scheduler Service - Scheduled job executor
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickcommerce-scheduler
    env_file:
      - .env
    environment:
      PROCESS_ROLE: scheduler
      NODE_ENV: production
      HEALTH_CHECK_PORT: 9090
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - quickcommerce-network

volumes:
  redis-data:
    driver: local

networks:
  quickcommerce-network:
    driver: bridge
